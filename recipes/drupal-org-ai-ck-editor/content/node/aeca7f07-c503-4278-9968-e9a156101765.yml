      value: '<div class="subhead js-subhead"><div class="constraint width-limit"><div class="column"><div class="standfirst article-subhead rich-content" data-js-ligatures="basic"><p>As <em>Mickey 17</em> takes audiences into Bong Joon Ho’s singular world once again, we dive into the Letterboxd community’s ranking of the director’s entire ﬁlmography from best to worst.</p></div></div></div></div><div class="body"><div class="constraint -divider width-limit"><div class="article-body-block -text"><div class="article-base rich-content"><p class="p1">It’s been six long years since <a href="https://boxd.it/og">the Bong Hive was born</a>, and thrived so much, with the world premiere, Palme d’Or and eventual Best Picture win of Bong Joon Ho’s masterpiece <em>Parasite</em>. It was a film that stole the hearts of the Letterboxd community and reminded us just how rich the South Korean writer and director’s oeuvre to that point already was.</p><p class="p1">The cast of <em>Mickey 17 </em>knows this: the actors bringing to life Director Bong’s latest picture, his first entirely English-language film which adapts Edward Ashton’s 2022 novel <em>Mickey7</em>, are, like us, cinephiles first and foremost. “He was always one of those directors—I had a similar experience with [David] Cronenberg—who was on such another level that they’re not accessible,” Robert Pattinson, who plays Mickey Barnes in the film, tells Letterboxd at the world premiere in London. “When I heard [Director Bong] was doing a movie all in English, was in LA, wanted to do meetings… I just felt like meeting an alien. I was so excited about it, he’s so wonderful.”</p><p class="p1">Steven Yeun, working with Bong Joon Ho for a second time after starring in 2017’s <em>Okja</em>, agrees that the filmmaker exists in a league of his own. “I love getting notes from Director Bong,” he says. “He’s so generous, he loves his characters. When he talks about them, it’s not through judgment, it’s this little aspect of that character that he really likes.” Both Pattinson and Yeun name the director’s sophomore feature, 2003’s <em>Memories of Murder</em>, as their favorite of Director Bong’s works. Yeun summarizes the magic of it all: “You just want to live in his frames—you want to <em>contribute</em> to that frame.”</p><p class="p1">The Letterboxd community wants to live in so many of Director Bong’s frames, over and over again—whether the chugging dystopian train only moving in one direction in <em>Snowpiercer</em>; the peaceful, distant Korean mountaintops of <em>Okja</em>; the rain-soaked streets of small-town southern Korea in <em>Mother</em> and <em>Memories of Murder</em>; and, of course, <em>that</em> house in <em>Parasite</em>. That Oscar winner remains our highest-rated of the decade (and one of our top 10 highest-rated titles of all time, <em>and</em> soon one of two pictures that are part of the Five Million Watched Club!), and <em>Mickey 17</em> was the most anticipated movie of 2025. So, without further ado, we present all the films directed by Bong Joon Ho in order of their average Letterboxd rating, from lowest to highest.</p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/barking-dogs-never-bite/">Barking Dogs Never Bite</a> <span class="year">2000</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text"><div class="article-base rich-content"><h2><strong>8.</strong> <a href="https://boxd.it/1BLa"><em><strong>Barking Dogs Never Bite</strong></em></a><em><strong> </strong></em><strong>(2000)</strong></h2><p class="p1 meta">Written by Bong Joon Ho, Song Ji-ho, Son Tae-woon<br>Average rating: 3.54</p><p class="p1">“Rough around the edges in many ways and far more cynical than other work from Bong Joon Ho, <em>Barking Dogs Never Bite</em> stares directly at our self-manufactured problems and allows them to spiral out of control in a film that is far funnier than it has any right to be.” —<a href="https://boxd.it/92qTKZ"><em>Movie Good or Movie Bad?</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/snowpiercer/">Snowpiercer</a> <span class="year">2013</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text article-body-block-intermission-sibling" data-js-intermission-sibling=""><div class="article-base rich-content"><h2><strong>7.</strong><em><strong> </strong></em><a href="https://boxd.it/3Icg"><em><strong>Snowpiercer</strong></em></a><em><strong> </strong></em><strong>(2013)</strong></h2><p class="p1 meta">Written by Bong Joon Ho and Kelly Masterson<br>Average rating: 3.68</p><p class="p1">“Yoooo this is obviously not everyone’s cup of tea (or, uh, brick of insect-mush) but I loved it so much. Bong Joon Ho’s movies really all revolve around the same ideas, but they approach and tackle those ideas in very different ways. This makes such an interesting double feature with <em>Parasite</em>, because Bong is the kind of director who feels like his distinct personality and soul are carried over between every movie, but his actual stylistic approach often changes drastically from film to film. It’s also the rare feat of storytelling that manages to function as both a surface-level thriller AND an entirely allegorical parable; though I think the parable part works a whole lot better, because if you take everything literally as it is on the page here, you’ll find plenty of CinemaSins nonsense to nitpick. I don’t care in the slightest.”—<a href="https://boxd.it/RBGM3" target="_blank" rel="noopener"><em>Houston Coley</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/okja/">Okja</a> <span class="year">2017</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text"><div class="article-base rich-content"><h2><strong>6.</strong><em><strong> </strong></em><a href="https://boxd.it/dvXe"><em><strong>Okja</strong></em></a><em><strong> </strong></em><strong>(2017)</strong></h2><p class="p1 meta">Written by Bong Joon Ho and Jon Ronson<br>Average rating: 3.70</p><p class="p1">“This film is like an R-Rated Miyazaki. It’s a good film that’s so heartfelt and sweet, but most importantly is extremely well made. Bong Joon Ho is such a meticulous artist and it really shows on screen. Everything looks so clean and smooth and the story has great pacing. Also, I unhappily admit that in the third act of this I was eating an Italian sub with salami. Talk about a mood killer.” —<a href="https://boxd.it/92ITrz"><em>Levi</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/mickey-17/">Mickey 17</a> <span class="year">2025</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text"><div class="article-base rich-content"><h2><em><strong>5. </strong></em><a href="https://boxd.it/q1Dk"><em><strong>Mickey 17</strong></em></a><em><strong> </strong></em><strong>(2025)</strong></h2><p class="p1 meta">Written by Bong Joon Ho, based on the novella by Edward Ashton<br>Average rating: 3.74</p><p class="p1">“Very happy to report that this is yet another Bong hit. Such a delightful time at the movies. Hilarious and strange and consistently surprising. Works as a goofy out-and-out comedy, a heady sci-fi blockbuster with ideas on its mind, an obvious but effective political satire, and a sweet and affecting romance. Pretty rare these days to see a major studio movie as zany and inspired and go-for-broke as this. Loved it and it only gets better the more I sit with it.”—<a href="https://boxd.it/8Qmf1f"><em>julie</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/the-host/">The Host</a> <span class="year">2006</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text"><div class="article-base rich-content"><h2><strong>4.</strong><em><strong> </strong></em><a href="https://boxd.it/28ZY"><em><strong>The Host</strong></em></a><em><strong> </strong></em><strong>(2006)</strong></h2><p class="p1 meta">Written by Baek Chul-hyun, Bong Joon Ho, Joo Byeol and Hah Jun-won<br>Average rating: 3.77</p><p class="p1">“On one level obviously just works as a thrilling environmental anxiety monster blockbuster, that opening chaos is loud and gnarly and has some of the cleanest camera movement you could hope for out of a sequence like that, but it wouldn’t truly be a Bong Joon Ho movie without smuggling in some genuinely affecting generational class drama (‘you can hear a parent’s heart break for miles‘) and satirical bureaucratic cynicism. A lot more Romero in this than I remembered;<em> The Crazies</em> especially. ‘Morons, to the end.’”—<a href="https://boxd.it/39C8Lv"><em>Josh</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/mother-2009/">Mother</a> <span class="year">2009</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text"><div class="article-base rich-content"><h2><em><strong>3. </strong></em><a href="https://boxd.it/1m9g"><em><strong>Mother</strong></em></a><em><strong> </strong></em><strong>(2009)</strong></h2><p class="p1 meta">Written by Bong Joon Ho and Park Eun-kyo<br>Average rating: 4.17</p><p class="p1">“Powerful portrayal of unconditional love, shocking and heartbreaking from beginning to end. That’s a given, this is a Bong Joon Ho murder mystery we’re talking about, where your prediction does not mean shit and any plot progression can be massively derailed with each tiny bit of information revealed. Not the revenge thriller I was looking for but ended up absolutely loving it anyway. Going to make it a tradition to watch this on every Mother’s Day for the next few decades.”—<a href="https://boxd.it/iSP31"><em>Yi</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/memories-of-murder/">Memories of Murder</a> <span class="year">2003</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text article-body-block-intermission-sibling" data-js-intermission-sibling=""><div class="article-base rich-content"><h2><em><strong>2. </strong></em><a href="https://boxd.it/1TSo"><em><strong>Memories of Murder</strong></em></a><em><strong> </strong></em><strong>(2003)</strong></h2><p class="p3 meta">Written by Bong Joon Ho and Shim Sung-bo, based on a play by Kim Kwang-lim<br>Average rating: 4.42</p><p class="p3">“The film ends, but its weight lingers. The unanswered questions, the quiet desperation, the rain-soaked silence, it all feels too real. It’s not just a story, it’s a wound that refuses to heal. Some truths remain lost, and that is the saddest part of all.”—<a href="https://boxd.it/8PyVyl"><em>Zeeshan</em></a></p><div class="details" data-js-prettify=""><h4 class="title"><a class="name" href="https://letterboxd.com/film/parasite-2019/">Parasite</a> <span class="year">2019</span></h4><p class="metadata">Directed by <a href="https://letterboxd.com/director/bong-joon-ho/">Bong Joon Ho</a></p></div></div></div><div class="article-body-block -text"><div class="article-base rich-content"><h2><em><strong>1. </strong></em><a href="https://boxd.it/hTha"><em><strong>Parasite</strong></em></a><em><strong> </strong></em><strong>(2019)</strong></h2><p class="p1 meta">Written by Kim Dae-hwan, Han Jin-won and Bong Joon Ho<br>Average rating: 4.55</p><p class="p3">“You know that feeling when the movie is so good that when it ends, you feel as though a large part of your self has also departed from your body and eventually left behind a void inside you? That’s exactly how I felt after watching <em>Parasite</em>. I will be picking this out of my teeth for weeks, maybe months, or even years to come. If you think you know what’s coming or what Bong Joon-ho has in store for you? Maybe think again. Probably my favorite ‘ghost’ story out there. Best to watch with your whole family. #BongHive”—<a href="https://boxd.it/MuuMh" target="_blank" rel="noopener"><em>Hungkat</em></a></p><img src="https://nginx.main.kelly-drupal-cms-ai-example-ck-editor.test6.amazee.io/sites/default/files/inline-images/parasite.jpg" data-entity-uuid="d870bbd4-84bc-403c-986f-36662d628bd1" data-entity-type="file" alt="Two young people, a woman and a man, sitting next to each other and looking at their smartphones." width="800" height="450"></div></div><div class="article-body-block -text"><div class="article-base article-accent rich-content"><hr><p><em>‘</em><a href="https://boxd.it/q1Dk"><em>Mickey 17</em></a><em>’ is in theaters globally now courtesy of Warner Bros.</em></p></div></div></div></div>'
      format: content_with_ai
  field_description:
