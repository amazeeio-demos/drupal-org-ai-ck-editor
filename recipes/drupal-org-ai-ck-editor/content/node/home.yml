      value: '<drupal-media data-entity-type="media" data-entity-uuid="0e579fbe-c0d0-4079-9745-6afd165f5a96">&nbsp;</drupal-media><p><strong>Welcome </strong>to your fully-configured free trial environment. Transform your content workflow with AI tools built right into the editor. Your site comes pre-configured with everything you need to test drive the future of Drupal AI.&nbsp;</p><h2 dir="ltr">How-to Guide</h2><h3>Using the AI Content Assistant</h3><p dir="ltr"><strong>Step 1 - Create Basic Page:</strong> In the left-hand navigation of this site, hover over ''Create'' and click on ''Basic page''.&nbsp;</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="ffddc31c-0601-4e23-ac23-dc12dcef5c73">&nbsp;</drupal-media></td></tr></tbody></table><p><strong>Step 2 - Text Format:</strong> At the bottom of the Content block is a Text Format dropdown. Make sure this is set to ''Content with AI''. This will make the ''AI Assistant'' in the CKEditor available.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="dd962c8e-300c-4b3f-9cf9-252bfdb74de7">&nbsp;</drupal-media><p>&nbsp;</p></td></tr></tbody></table><p dir="ltr"><strong>Step 3 - Populate Content:</strong> You will see a blank screen where you can start adding your content. For your convenience, here are some content examples you can use to test the feature.</p><ol><li dir="ltr"><a href="https://letterboxd.com/journal/bong-hit-parasite/">https://letterboxd.com/journal/bong-hit-parasite/</a></li><li dir="ltr"><a href="https://letterboxd.com/journal/bong-joon-ho-ranking/">https://letterboxd.com/journal/bong-joon-ho-ranking/</a></li><li dir="ltr"><a href="https://letterboxd.com/journal/sxsw-2025-festival-preview/">https://letterboxd.com/journal/sxsw-2025-festival-preview/</a></li><li dir="ltr"><a href="https://letterboxd.com/journal/most-picture-dune-part-two-denis-villeneuve/">https://letterboxd.com/journal/most-picture-dune-part-two-denis-villeneuve/</a></li><li dir="ltr"><a href="https://letterboxd.com/journal/watchlist-this-february-2025/">https://letterboxd.com/journal/watchlist-this-february-2025/</a>&nbsp;</li></ol><p dir="ltr">The Summarize Tool does not act on the contents of the Title and Description fields. For the purposes of this trial, it is simply necessary to populate these fields with some sample content in order to save the page.</p><p dir="ltr">Copy the title of an article into the Title field in the CMS or input your own title. This is a mandatory field - it will not be possible to save the page without a title.</p><p dir="ltr">Copy the article byline into the Description field in the CMS or input your own description. This is a mandatory field.</p><p dir="ltr">Below the Description field is the main Content block. This is the CKEditor - the Summarize Tool will act on content added here. Copy a few paragraphs of article content from a Letterboxd article and paste it into this Content block, or input your own content.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="4fb74559-8ce5-4ac4-84f6-0de84118ed19">&nbsp;</drupal-media></td></tr></tbody></table><p dir="ltr"><strong>Step 4 - Accessing the AI Assistant:</strong> Highlight all of the text you want to summarize. For the purpose of this demo, highlight all text in the Content block. Then click on ''AI Assistant'' in the CKEditor toolbar. From the dropdown, you will see all AI Assistant features available:&nbsp;</p><ol><li dir="ltr">Image Alt Text Generator</li><li dir="ltr">Style Guide</li><li dir="ltr">Summarize Text</li></ol><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="56201bfe-95ba-4297-ade7-29873a778444">&nbsp;</drupal-media></td></tr></tbody></table><h3 dir="ltr">Image Alt Text Generator</h3><p dir="ltr"><strong>Step 1 - Add an image:&nbsp;</strong>Before this step, be sure to have followed the instructions up to this point (above). To use the Image Alt Text Generator, an image needs to be added to the Content block. Locate the image upload icon in the CKEditor toolbar and upload an image from your personal computer. Alternatively, browse to a provided Letterboxd page, save an image to your computer, and upload the image in the same way.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="28fc956d-4633-4d5e-82c7-b613435390b7">&nbsp;</drupal-media></td></tr></tbody></table><p dir="ltr">Please note that images that have been copy/pasted into the Content block will appear in the editor and will render on the frontend, but the Image Alt Text Generator tool will not work on them. The Image Alt Text Generator needs an uploaded image.</p><p dir="ltr"><strong>Step 2 - Select the Image Alt Text Generator:&nbsp;</strong>Click on the uploaded image to select it. Then click on the ''AI Assistant'' dropdown in the CKEditor toolbar and select ''Image Alt Text Generator''.&nbsp;</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="867208ff-7d80-4f14-9558-9e9d1382d8d6">&nbsp;</drupal-media></td></tr></tbody></table><p><strong>Step 3 - Generate Image Alt Text:&nbsp;</strong>In the modal, the image that was selected in the Content block in the previous step will show under ''Upload a file''. To generate the image alt text, simply click the ''Generate'' button at the bottom left of the modal.&nbsp;</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="bcfa1b3d-f01d-4bb7-9d00-5f4cfb34e891">&nbsp;</drupal-media></td></tr></tbody></table><p dir="ltr">Clicking the ''Generate'' button will add the image to the ''Response from AI'' block. Click ''Save changes to editor'' to proceed.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="065a5907-62c4-442f-a440-c45326e3539a">&nbsp;</drupal-media></td></tr></tbody></table><p dir="ltr"><strong>Step 4 - View Image Alt Text:&nbsp;</strong>In the CKEditor, click on the image. In the submenu that appears, clicking on the eye icon will reveal the alt text.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="77fb395e-4bad-4cc6-a116-aafb5ef1896a">&nbsp;</drupal-media></td></tr></tbody></table><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="7c7b41bc-87f6-4209-bab9-ca0a592f1550">&nbsp;</drupal-media></td></tr></tbody></table><h3 dir="ltr">Style Guide</h3><p><strong>Step 1 - Select Style Guide:&nbsp;</strong>The style guide can be customized to meet your business needs. For this trial, we''ve selected a basic business guide. Select all the text in the Content block that you want rewritten according to the style guide. Please note that this feature replaces the selected text in the Content block. Editors will have the option to review the revised content first before saving the changes.&nbsp;</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="a9145139-9a04-45e0-9ef2-83d8aa9a57e8">&nbsp;</drupal-media></td></tr></tbody></table><p dir="ltr"><strong>Step 2 - Generate Revised Content:&nbsp;</strong>In the modal, the selected text will appear in the ''Input'' field. Clicking the ''Generate'' button will rewrite the selected content according to the style guide.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="43d799a0-7cdf-4c16-a0df-78b840570eed">&nbsp;</drupal-media></td></tr></tbody></table><p dir="ltr">At this stage, editors can review, revise or regenerate the content before clicking ''Save changes to editor''. Saving the changes will overwrite the original content in the CKEditor.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="19f70771-484a-4563-82b1-1ee524b3fd66">&nbsp;</drupal-media></td></tr></tbody></table><h3 dir="ltr">Summarize Text</h3><p dir="ltr"><strong>Step 1 - Select Summarize Text:&nbsp;</strong>Select all the text in the Content block that you want summarized. Please note that this feature replaces the selected text in the Content block. Editors will have the option to review the revised content first before saving the changes.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="6147dbb6-fa8e-4014-9a56-34de01e2b45d">&nbsp;</drupal-media></td></tr></tbody></table><p><strong>Step 2 - Generate Summary:&nbsp;</strong>In the modal, the selected text will appear in the ''Input'' field. Clicking the ''Generate'' button will rewrite the selected content, summarizing it down to a few lines or a paragraph.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="cc2dd4e9-9c25-43d9-a887-efb97a17ca55">&nbsp;</drupal-media></td></tr></tbody></table><p>At this stage, editors can review, revise or regenerate the content before clicking ''Save changes to editor''. Saving the changes will overwrite the original content in the CKEditor.</p><table><tbody><tr><td><drupal-media data-entity-type="media" data-entity-uuid="60c4ed5e-18bf-45fd-8d16-c89237a2f394">&nbsp;</drupal-media></td></tr></tbody></table>'
      format: content_format
  field_description:
    -
      value: 'How-to guide'
